<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Ibadan Life</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
:root{
  --bg:#070b12;
  --panel:#0d1420;
  --panel2:#111b2a;
  --glass:rgba(13,20,32,.86);
  --line:rgba(255,255,255,.09);
  --text:#f7f9fc;
  --muted:#8995a8;
  --green:#25e38a;
  --blue:#4b8cff;
  --orange:#ffad42;
  --red:#ff5573;
  --purple:#a878ff;
  --cyan:#25d9ff;
  --shadow:0 20px 60px rgba(0,0,0,.42);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   LOGIN
========================================================= */

#authScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  overflow:auto;
  background:
    radial-gradient(circle at 20% 10%,rgba(37,227,138,.17),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(75,140,255,.20),transparent 35%),
    linear-gradient(135deg,#050810,#0b1220);
}

.authBox{
  width:min(440px,100%);
  padding:30px;
  border:1px solid var(--line);
  border-radius:30px;
  background:rgba(9,14,23,.82);
  box-shadow:var(--shadow);
  backdrop-filter:blur(25px);
}

.logo{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:26px;
}

.logoMark{
  width:55px;
  height:55px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:28px;
  background:linear-gradient(135deg,var(--green),var(--blue));
  box-shadow:0 10px 35px rgba(37,227,138,.25);
}

.logo h1{
  margin:0;
  font-size:26px;
}

.logo small{
  display:block;
  margin-top:3px;
  color:var(--muted);
}

.authTabs{
  display:flex;
  gap:6px;
  padding:5px;
  border-radius:14px;
  background:#080d16;
  margin-bottom:20px;
}

.authTabs button{
  flex:1;
  padding:11px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
}

.authTabs button.active{
  background:#182335;
  color:white;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:12px;
  color:var(--muted);
}

.field input{
  width:100%;
  padding:14px 15px;
  border-radius:14px;
  border:1px solid var(--line);
  outline:none;
  color:white;
  background:#0a101a;
}

.field input:focus{
  border-color:var(--green);
}

.primary{
  width:100%;
  padding:15px;
  border-radius:15px;
  font-weight:800;
  background:linear-gradient(135deg,var(--green),#16b9e8);
  color:#03110c;
  margin-top:4px;
}

.google{
  width:100%;
  padding:14px;
  border-radius:15px;
  background:white;
  color:#111;
  font-weight:700;
  margin-top:10px;
}

.authMsg{
  min-height:20px;
  margin-top:12px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* =========================================================
   GAME
========================================================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#map{
  position:absolute;
  inset:0;
  background:#101923;
}

.leaflet-control-attribution{
  font-size:8px!important;
}

/* =========================================================
   TOP HUD
========================================================= */

.topHUD{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:2000;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  pointer-events:none;
}

.playerMini{
  pointer-events:auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 13px 8px 8px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}

.avatar{
  width:40px;
  height:40px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,#3a79ff,#8e53ff);
}

.playerName{
  font-weight:800;
  font-size:13px;
}

.level{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.stats{
  pointer-events:auto;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
  max-width:55%;
}

.stat{
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  font-size:11px;
  box-shadow:var(--shadow);
}

.stat b{
  margin-left:4px;
}

.money b{color:var(--green)}
.energy b{color:var(--orange)}
.xp b{color:var(--blue)}

/* =========================================================
   MAP SIDE CONTROLS
========================================================= */

.mapControls{
  position:absolute;
  right:12px;
  top:105px;
  z-index:1500;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.mapBtn{
  width:45px;
  height:45px;
  border-radius:15px;
  border:1px solid var(--line);
  background:var(--glass);
  backdrop-filter:blur(20px);
  font-size:19px;
  box-shadow:var(--shadow);
}

.mapBtn:active{
  transform:scale(.94);
}

/* =========================================================
   WORLD EVENT CARD
========================================================= */

.worldCard{
  position:absolute;
  z-index:1400;
  left:12px;
  top:104px;
  width:min(260px,calc(100% - 75px));
  padding:13px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}

.worldTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-weight:800;
  font-size:12px;
}

.liveDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.worldText{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
}

/* =========================================================
   QUICK ACTIONS
========================================================= */

.quickActions{
  position:absolute;
  left:12px;
  right:12px;
  bottom:90px;
  z-index:1600;
  display:flex;
  gap:8px;
  justify-content:center;
  pointer-events:none;
}

.quick{
  pointer-events:auto;
  min-width:68px;
  padding:9px 11px;
  border-radius:15px;
  border:1px solid var(--line);
  background:var(--glass);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
  text-align:center;
  font-size:11px;
}

.quick span{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottomNav{
  position:absolute;
  z-index:5000;
  left:9px;
  right:9px;
  bottom:calc(8px + env(safe-area-inset-bottom));
  height:66px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:5px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(7,11,18,.92);
  backdrop-filter:blur(25px);
  box-shadow:0 15px 55px rgba(0,0,0,.55);
}

.navBtn{
  width:20%;
  height:56px;
  border-radius:16px;
  background:transparent;
  color:#788497;
  font-size:10px;
}

.navBtn span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.navBtn.active{
  background:#172235;
  color:white;
}

.phoneNav{
  position:relative;
}

.notificationBadge{
  position:absolute;
  top:3px;
  right:14px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:var(--red);
  color:#fff;
  font-size:9px;
  font-weight:900;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
  position:absolute;
  z-index:6000;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.48);
  backdrop-filter:blur(4px);
}

.panelCard{
  width:min(650px,100%);
  max-height:91%;
  overflow:auto;
  padding:18px;
  border:1px solid var(--line);
  border-radius:28px 28px 0 0;
  background:
    linear-gradient(180deg,#101a29,#080d15);
  box-shadow:0 -20px 70px rgba(0,0,0,.5);
}

.panelHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.panelHeader h2{
  margin:0;
  font-size:20px;
}

.closeBtn{
  width:37px;
  height:37px;
  border-radius:12px;
  background:#182333;
  color:#aeb9ca;
}

/* =========================================================
   PHONE
========================================================= */

.phonePanel{
  align-items:center;
  background:rgba(0,0,0,.72);
}

.phone{
  position:relative;
  width:min(370px,92vw);
  height:min(760px,88vh);
  overflow:hidden;
  border:8px solid #1a1d25;
  border-radius:43px;
  background:#070b13;
  box-shadow:
    0 35px 100px rgba(0,0,0,.75),
    inset 0 0 0 1px #444;
}

.phoneNotch{
  position:absolute;
  z-index:20;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:115px;
  height:27px;
  border-radius:0 0 18px 18px;
  background:#08090c;
}

.phoneStatus{
  position:absolute;
  z-index:10;
  top:7px;
  left:17px;
  right:17px;
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:white;
  pointer-events:none;
}

.phoneHome{
  position:absolute;
  inset:0;
  padding:42px 16px 18px;
  overflow:auto;
  background:
    radial-gradient(circle at 20% 10%,rgba(37,227,138,.22),transparent 35%),
    radial-gradient(circle at 90% 70%,rgba(76,105,255,.25),transparent 40%),
    linear-gradient(145deg,#09111d,#111725);
}

.phoneGreeting{
  margin:15px 5px 20px;
}

.phoneGreeting small{
  color:#a4afc0;
}

.phoneGreeting h2{
  margin:4px 0;
  font-size:27px;
}

.phoneDate{
  color:#7d8a9f;
  font-size:11px;
}

.phoneWidgets{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:17px;
}

.phoneWidget{
  padding:14px;
  min-height:84px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:19px;
  background:rgba(255,255,255,.06);
}

.phoneWidget .big{
  font-size:22px;
  font-weight:900;
}

.phoneWidget small{
  color:#8490a4;
}

.appGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px 8px;
}

.app{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  background:none;
  color:white;
  font-size:10px;
}

.appIcon{
  width:53px;
  height:53px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:25px;
  background:linear-gradient(145deg,#1a2a40,#101825);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.app:nth-child(2n) .appIcon{
  background:linear-gradient(145deg,#192b25,#101c19);
}

.appBadge{
  position:absolute;
  top:-4px;
  right:12px;
  width:18px;
  height:18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--red);
  font-size:9px;
  font-weight:900;
}

.phoneDock{
  position:absolute;
  left:13px;
  right:13px;
  bottom:14px;
  height:66px;
  border-radius:23px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
}

.dockBtn{
  background:none;
  font-size:22px;
}

.dockBtn small{
  display:block;
  color:#9ca8ba;
  font-size:8px;
  margin-top:2px;
}

/* =========================================================
   PHONE APP
========================================================= */

.phoneApp{
  position:absolute;
  inset:0;
  z-index:30;
  padding:43px 15px 15px;
  overflow:auto;
  background:#080d15;
}

.appHeader{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.appBack{
  width:37px;
  height:37px;
  border-radius:12px;
  background:#172231;
}

.appHeader h3{
  margin:0;
  font-size:18px;
}

.appContent{
  padding-bottom:20px;
}

/* =========================================================
   APP COMPONENTS
========================================================= */

.card{
  padding:15px;
  margin-bottom:10px;
  border-radius:18px;
  border:1px solid var(--line);
  background:#101927;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:11px;
}

.bigNumber{
  font-size:29px;
  font-weight:900;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.blue{
  color:var(--blue);
}

.purple{
  color:var(--purple);
}

.appAction{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:#182536;
  margin-top:9px;
  text-align:center;
}

.appAction.primaryAction{
  background:linear-gradient(135deg,var(--green),#14b9e8);
  color:#03100b;
  font-weight:900;
}

.appInput{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:#080d15;
  border:1px solid var(--line);
  color:white;
  outline:none;
  margin-top:8px;
}

.progress{
  height:7px;
  border-radius:10px;
  background:#1d2735;
  overflow:hidden;
  margin-top:8px;
}

.progress i{
  display:block;
  height:100%;
  width:50%;
  background:linear-gradient(90deg,var(--green),var(--cyan));
}

.listItem{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.listItem:last-child{
  border-bottom:0;
}

.listAvatar{
  width:39px;
  height:39px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-weight:900;
  background:#24334b;
}

/* =========================================================
   CHAT
========================================================= */

.chatMessages{
  height:370px;
  overflow:auto;
  padding:8px;
  border-radius:17px;
  background:#080d15;
}

.message{
  max-width:82%;
  padding:9px 11px;
  border-radius:15px;
  margin-bottom:8px;
  background:#182536;
}

.message.mine{
  margin-left:auto;
  background:#124c3a;
}

.message b{
  display:block;
  font-size:10px;
  margin-bottom:3px;
}

.message p{
  margin:0;
  font-size:12px;
  line-height:1.4;
}

.chatComposer{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.chatComposer input{
  flex:1;
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#080d15;
  color:white;
  outline:none;
}

.send{
  width:48px;
  border-radius:14px;
  background:var(--green);
  color:#04110b;
  font-weight:900;
}

/* =========================================================
   VOICE
========================================================= */

.voiceHero{
  padding:22px;
  text-align:center;
  border-radius:22px;
  background:
    radial-gradient(circle at center,rgba(37,227,138,.20),transparent 55%),
    #101927;
}

.voiceOrb{
  width:105px;
  height:105px;
  margin:10px auto 18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:42px;
  background:#162538;
  border:2px solid rgba(37,227,138,.45);
}

.voiceOrb.active{
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(37,227,138,.3)}
  50%{box-shadow:0 0 0 22px rgba(37,227,138,0)}
}

.voiceButtons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
}

.voiceButton{
  width:55px;
  height:55px;
  border-radius:18px;
  background:#1b293b;
}

.voiceButton.active{
  background:var(--green);
  color:#06130c;
}

.participants{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.participant{
  text-align:center;
  font-size:9px;
}

.participant .listAvatar{
  margin:auto auto 5px;
}

/* =========================================================
   GAME / BETTING
========================================================= */

.gameChoice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.gameChoice button{
  min-height:105px;
  border-radius:18px;
  background:#131f2f;
  border:1px solid var(--line);
}

.gameChoice button strong{
  display:block;
  margin-top:8px;
}

.betOdds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.odds{
  padding:12px;
  border-radius:13px;
  text-align:center;
  background:#172334;
}

.odds.selected{
  outline:2px solid var(--green);
}

.odds b{
  display:block;
  font-size:16px;
  color:var(--green);
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

#toastBox{
  position:absolute;
  z-index:10000;
  left:12px;
  right:12px;
  top:82px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  pointer-events:none;
}

.toast{
  max-width:360px;
  padding:11px 14px;
  border-radius:14px;
  background:#111c2b;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  font-size:12px;
  animation:toastIn .25s ease;
}

@keyframes toastIn{
  from{opacity:0;transform:translateY(-10px)}
  to{opacity:1;transform:none}
}

/* =========================================================
   PLAYER MARKER
========================================================= */

.playerMarker{
  width:38px;
  height:38px;
  border-radius:50%;
  border:3px solid white;
  display:grid;
  place-items:center;
  color:white;
  font-size:12px;
  font-weight:900;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:800px){

  .bottomNav{
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:560px;
  }

  .quickActions{
    bottom:90px;
  }

  .panel{
    align-items:center;
  }

  .panelCard{
    border-radius:27px;
    max-height:85vh;
  }

}

/* =========================================================
   LEAFLET
========================================================= */

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
  background:#101927;
  color:white;
}

.leaflet-popup-content{
  margin:12px;
  font-size:12px;
}
</style>
</head>

<body>

<!-- =======================================================
     AUTH
======================================================= -->

<section id="authScreen">

  <div class="authBox">

    <div class="logo">
      <div class="logoMark">🌆</div>
      <div>
        <h1>Ibadan Life</h1>
        <small>Live. Work. Connect. Build your city life.</small>
      </div>
    </div>

    <div class="authTabs">
      <button id="loginTab" class="active" onclick="showAuth('login')">
        Login
      </button>
      <button id="signupTab" onclick="showAuth('signup')">
        Create account
      </button>
    </div>

    <div id="loginForm">

      <div class="field">
        <label>Email or username</label>
        <input id="loginIdentity"
               autocomplete="username"
               placeholder="Enter username or email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPassword"
               type="password"
               autocomplete="current-password"
               placeholder="Password">
      </div>

      <button class="primary" onclick="login()">
        Enter Ibadan Life
      </button>

<script>
/* =========================================================
   GLOBAL STATE
========================================================= */

let socket = null;
let map = null;
let me = null;

let playerMarkers = {};
let npcMarkers = [];
let busMarkers = [];

let currentPhoneApp = null;
let selectedBet = null;
let selectedVoiceRoom = "Ibadan City";
let micStream = null;
let micEnabled = false;

const appTitles = {
  messages:"Messages",
  calls:"Calls",
  social:"Social",
  voice:"Voice Rooms",
  games:"Games",
  bet:"Ibadan Bet",
  bank:"My Bank",
  market:"Market",
  jobs:"Jobs",
  transport:"Transport",
  property:"Property",
  events:"Events",
  map:"City Map",
  news:"Ibadan News",
  rewards:"Rewards",
  profile:"My Profile",
  inventory:"Inventory"
};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function money(n){
  return "₦" + Number(n || 0).toLocaleString();
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function initials(name){
  return String(name || "P")
    .trim()
    .slice(0,2)
    .toUpperCase();
}

function toast(message){
  const box = $("toastBox");

  const item = document.createElement("div");
  item.className = "toast";
  item.textContent = message;

  box.appendChild(item);

  setTimeout(()=>{
    item.remove();
  },3200);
}


/* =========================================================
   AUTH
========================================================= */

function showAuth(type){

  const login = type === "login";

  $("loginForm").classList.toggle("hidden",!login);
  $("signupForm").classList.toggle("hidden",login);

  $("loginTab").classList.toggle("active",login);
  $("signupTab").classList.toggle("active",!login);

  $("authMsg").textContent = "";
}

async function api(url,options={}){
  const response = await fetch(url,{
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    },
    ...options
  });

  const data = await response.json().catch(()=>({}));

  if(!response.ok){
    throw new Error(data.error || "Request failed");
  }

  return data;
}

async function login(){

  const identity = $("loginIdentity").value.trim();
  const password = $("loginPassword").value;

  if(!identity || !password){
    $("authMsg").textContent = "Enter your login details.";
    return;
  }

  try{

    $("authMsg").textContent = "Signing in...";

    const data = await api("/api/auth/login",{
      method:"POST",
      body:JSON.stringify({
        identity,
        password
      })
    });

    if(data.token){
      localStorage.setItem("ibadan_token",data.token);
    }

    await startGame();

  }catch(err){
    $("authMsg").textContent = err.message;
  }
}

async function signup(){

  const username = $("signupUsername").value.trim();
  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  if(!username || !name || !email || !password){
    $("authMsg").textContent = "Complete all fields.";
    return;
  }

  try{

    $("authMsg").textContent = "Creating your city life...";

    const data = await api("/api/auth/signup",{
      method:"POST",
      body:JSON.stringify({
        username,
        name,
        email,
        password
      })
    });

    if(data.token){
      localStorage.setItem("ibadan_token",data.token);
    }

    await startGame();

  }catch(err){
    $("authMsg").textContent = err.message;
  }
}

async function recoverPassword(){

  const email = prompt("Enter your email:");

  if(!email) return;

  try{

    await api("/api/auth/recovery",{
      method:"POST",
      body:JSON.stringify({email})
    });

    toast("Recovery request sent.");

  }catch(err){
    toast(err.message);
  }
}

function googleLogin(){

  window.location.href = "/api/auth/google";
}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

  try{

    const token = localStorage.getItem("ibadan_token");

    if(!token){
      throw new Error("No login token.");
    }

    const response = await fetch("/api/auth/me",{
      headers:{
        Authorization:"Bearer " + token
      }
    });

    if(!response.ok){
      throw new Error("Session expired.");
    }

    const data = await response.json();

    me = data.player || data.user || data;

    $("authScreen").classList.add("hidden");
    $("game").classList.remove("hidden");

    initMap();
    initSocket();
    updateHUD();

  }catch(err){

    localStorage.removeItem("ibadan_token");

    $("authMsg").textContent =
      err.message || "Please login again.";
  }
}


/* =========================================================
   MAP
========================================================= */

function initMap(){

  if(map) return;

  map = L.map("map",{
    zoomControl:false,
    attributionControl:true
  }).setView(
    [
      Number(me?.lat || 7.3900),
      Number(me?.lng || 3.9100)
    ],
    13
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);

  map.on("click",e=>{

    if(socket){
      socket.emit("moveTo",{
        lat:e.latlng.lat,
        lng:e.latlng.lng
      });
    }

  });
}

function locatePlayer(){

  if(!map || !me) return;

  map.flyTo(
    [
      Number(me.lat || 7.39),
      Number(me.lng || 3.91)
    ],
    16,
    {
      duration:1
    }
  );
}

function zoomIn(){
  if(map) map.zoomIn();
}

function zoomOut(){
  if(map) map.zoomOut();
}


/* =========================================================
   SOCKET
========================================================= */

function initSocket(){

  if(socket) return;

  socket = io({
    auth:{
      token:localStorage.getItem("ibadan_token")
    }
  });

  socket.on("connect",()=>{
    toast("Connected to Ibadan Life.");
  });

  socket.on("connect_error",err=>{
    toast("Connection problem: " + err.message);
  });

  socket.on("places",places=>{
    renderPlaces(places);
  });

  socket.on("me",data=>{
    me = data.player || data;
    updateHUD();
  });

  socket.on("state",data=>{
    me = data.player || data;
    updateHUD();
  });

  socket.on("world",world=>{
    renderWorld(world);
  });

  socket.on("chat",message=>{
    addChatMessage(message);
  });

  /*
    These are ready for the advanced voice backend.
  */

  socket.on("voice:user-joined",data=>{
    toast(
      (data.name || "Someone") +
      " joined the voice room."
    );
  });

  socket.on("voice:user-left",data=>{
    toast(
      (data.name || "Someone") +
      " left the voice room."
    );
  });

  socket.on("voice:status",data=>{
    if(data){
      toast(data.message || "Voice updated.");
    }
  });
}


/* =========================================================
   WORLD
========================================================= */

function renderWorld(world){

  if(!world) return;

  if(world.hour !== undefined){

    $("worldText").textContent =
      "Ibadan time • " +
      String(world.hour).padStart(2,"0") +
      ":00";
  }

  /*
    NPCs
  */

  npcMarkers.forEach(m=>{
    if(map) map.removeLayer(m);
  });

  npcMarkers = [];

  if(Array.isArray(world.npcs)){

    world.npcs.forEach(npc=>{

      if(!npc.lat || !npc.lng) return;

      const marker = L.circleMarker(
        [npc.lat,npc.lng],
        {
          radius:6,
          color:"#ffad42",
          fillColor:"#ffad42",
          fillOpacity:.9
        }
      ).addTo(map);

      marker.bindPopup(
        "<b>" +
        escapeHTML(npc.name || "NPC") +
        "</b>"
      );

      npcMarkers.push(marker);
    });
  }

  /*
    Buses
  */

  busMarkers.forEach(m=>{
    if(map) map.removeLayer(m);
  });

  busMarkers = [];

  if(Array.isArray(world.buses)){

    world.buses.forEach(bus=>{

      if(!bus.lat || !bus.lng) return;

      const marker = L.marker(
        [bus.lat,bus.lng],
        {
          icon:L.divIcon({
            className:"",
            html:
              '<div style="' +
              'width:34px;height:34px;' +
              'border-radius:12px;' +
              'background:#16263a;' +
              'border:2px solid #25d9ff;' +
              'display:grid;place-items:center;' +
              'font-size:18px;">🚌</div>',
            iconSize:[34,34],
            iconAnchor:[17,17]
          })
        }
      ).addTo(map);

      marker.bindPopup(
        "<b>Danfo</b><br>Public transport"
      );

      busMarkers.push(marker);
    });
  }
}


/* =========================================================
   PLACES / OTHER PLAYERS
========================================================= */

function renderPlaces(data){

  /*
    Supports several backend shapes.
  */

  const players =
    data?.players ||
    data?.nearby ||
    [];

  Object.keys(playerMarkers).forEach(id=>{

    if(!players.find(p=>String(p.id)===String(id))){

      map.removeLayer(playerMarkers[id]);
      delete playerMarkers[id];
    }

  });

  players.forEach(player=>{

    if(!player.lat || !player.lng) return;

    if(String(player.id) === String(me?.id)){
      return;
    }

    const color =
      player.color ||
      "#4b8cff";

    const icon = L.divIcon({

      className:"",

      html:
        '<div class="playerMarker" style="background:' +
        escapeHTML(color) +
        '">' +
        escapeHTML(initials(player.name || player.username)) +
        "</div>",

      iconSize:[38,38],
      iconAnchor:[19,19]

    });

    if(playerMarkers[player.id]){

      playerMarkers[player.id].setLatLng([
        player.lat,
        player.lng
      ]);

    }else{

      const marker =
        L.marker(
          [player.lat,player.lng],
          {icon}
        ).addTo(map);

      marker.bindPopup(
        "<b>" +
        escapeHTML(
          player.name ||
          player.username ||
          "Player"
        ) +
        "</b><br>" +
        "Level " +
        escapeHTML(player.level || 1) +
        "<br><br>" +
        "<button onclick=\"openPhoneApp('social')\">" +
        "View player" +
        "</button>"
      );

      playerMarkers[player.id] = marker;
    }

  });
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  if(!me) return;

  const name =
    me.name ||
    me.username ||
    "Player";

  $("hudName").textContent = name;

  $("hudLevel").textContent =
    "Level " +
    (me.level || 1);

  $("hudMoney").textContent =
    money(me.money);

  $("hudEnergy").textContent =
    Math.round(me.energy ?? 100);

  $("hudXP").textContent =
    (me.xp || 0) + " XP";

  $("hudAvatar").textContent =
    initials(name);

  $("phoneName").textContent =
    name;

  $("phoneMoney").textContent =
    money(me.money);

  $("phoneEnergy").textContent =
    "⚡" +
    Math.round(me.energy ?? 100);

  $("phoneDate").textContent =
    me.backgroundNeighborhood
      ? "📍 " + me.backgroundNeighborhood
      : "📍 Ibadan, Nigeria";

}


/* =========================================================
   BASIC ACTIONS
========================================================= */

function doAction(action){

  if(!socket){
    toast("Connecting...");
    return;
  }

  socket.emit(action);

  const names = {
    work:"Work started.",
    ride:"You entered transport.",
    eat:"You stopped to eat."
  };

  toast(names[action] || "Action completed.");
}


/* =========================================================
   PHONE
========================================================= */

function openPhone(){

  $("phonePanel").classList.remove("hidden");

  $("phoneHome").classList.remove("hidden");
  $("phoneApp").classList.add("hidden");

  updatePhoneClock();

}

function closePhone(){

  $("phonePanel").classList.add("hidden");

  stopMicrophone();

}

function openPhoneApp(app){

  $("phonePanel").classList.remove("hidden");
  $("phoneHome").classList.add("hidden");
  $("phoneApp").classList.remove("hidden");

  currentPhoneApp = app;

  $("appTitle").textContent =
    appTitles[app] || "App";

  renderApp(app);
}

function phoneBack(){

  if(currentPhoneApp === "home"){
    closePhone();
    return;
  }

  currentPhoneApp = "home";

  $("phoneApp").classList.add("hidden");
  $("phoneHome").classList.remove("hidden");
}


/* =========================================================
   PHONE CLOCK
========================================================= */

function updatePhoneClock(){

  const now = new Date();

  $("phoneTime").textContent =
    now.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

setInterval(updatePhoneClock,1000);


/* =========================================================
   APP ROUTER
========================================================= */

function renderApp(app){

  const content = $("appContent");

  const apps = {

    messages:renderMessages,
    calls:renderCalls,
    social:renderSocial,
    voice:renderVoice,
    games:renderGames,
    bet:renderBet,
    bank:renderBank,
    market:renderMarket,
    jobs:renderJobs,
    transport:renderTransport,
    property:renderProperty,
    events:renderEvents,
    map:renderMapApp,
    news:renderNews,
    rewards:renderRewards,
    profile:renderProfile,
    inventory:renderInventory

  };

  if(apps[app]){
    apps[app](content);
  }else{
    content.innerHTML =
      "<div class='card'>App coming soon.</div>";
  }
}


/* =========================================================
   MESSAGES
========================================================= */

let chatHistory = [];

function renderMessages(el){

  el.innerHTML = `

    <div class="card">

      <div class="row">
        <div>
          <b>🌍 Public City Chat</b>
          <div class="muted small">
            Talk with people currently in Ibadan Life.
          </div>
        </div>

        <span class="green">● LIVE</span>
      </div>

    </div>

    <div id="chatMessages"
         class="chatMessages">

      ${
        chatHistory.length
        ? chatHistory.map(formatMessage).join("")
        : `
          <div class="muted"
               style="text-align:center;padding:40px 10px">
            No messages yet.<br>
            Start the conversation.
          </div>
        `
      }

    </div>

    <div class="chatComposer">

      <input id="chatInput"
             placeholder="Write something...">

      <button class="send"
              onclick="sendChat()">
        ➤
      </button>

    </div>

    <button class="appAction"
            onclick="openPhoneApp('voice')">
      🎙️ Join a live voice room
    </button>
  `;

  setTimeout(()=>{

    const box = $("chatMessages");

    if(box){
      box.scrollTop = box.scrollHeight;
    }

    const input = $("chatInput");

    if(input){

      input.addEventListener("keydown",e=>{
        if(e.key === "Enter"){
          sendChat();
        }
      });

    }

  },50);
}

function formatMessage(m){

  const mine =
    String(m.userId || m.id || "") ===
    String(me?.id || "");

  return `

function addChatMessage(message){

  chatHistory.push(message);

  if(chatHistory.length > 100){
    chatHistory.shift();
  }

  if(currentPhoneApp === "messages"){
    renderMessages($("appContent"));
  }else{
    $("phoneBadge").classList.remove("hidden");
  }
}

function sendChat(){

  const input = $("chatInput");

  if(!input) return;

  const message =
    input.value.trim();

  if(!message) return;

  if(socket){
    socket.emit("chat",{message});
  }

  input.value = "";
}

async function toggleMicrophone(){

  if(micEnabled){

    stopMicrophone();
    return;
  }

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      toast("Your browser does not support microphone access.");
      return;
    }

    micStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    micEnabled = true;

    $("micButton")?.classList.add("active");
    $("voiceOrb")?.classList.add("active");

    if(socket){

      socket.emit("voice:join",{
        room:selectedVoiceRoom,
        name:me?.name || me?.username || "Player"
      });

      socket.emit("voice:mute",{
        room:selectedVoiceRoom,
        muted:false
      });

    }

    toast("Microphone is ON.");

  }catch(err){

    toast(
      "Microphone permission was not granted."
    );
  }
}

function stopMicrophone(){

  if(micStream){

    micStream
      .getTracks()
      .forEach(track=>track.stop());

    micStream = null;
  }

  micEnabled = false;

  $("micButton")?.classList.remove("active");
  $("voiceOrb")?.classList.remove("active");

  if(socket){

    socket.emit("voice:mute",{
      room:selectedVoiceRoom,
      muted:true
    });

  }
}

function joinVoiceRoom(room){

  selectedVoiceRoom = room;

  if(socket){

    socket.emit("voice:join",{
      room,
      name:me?.name || me?.username || "Player"
    });

  }

  renderVoice($("appContent"));

  toast("Joined " + room);
}

function leaveVoiceRoom(){

  stopMicrophone();

  if(socket){

    socket.emit("voice:leave",{
      room:selectedVoiceRoom
    });

  }

  toast("You left the voice room.");
}

        🏠
        <strong>Property</strong>
        <small class="muted">
          0 items
        </small>
      </button>

    </div>

  `;
}


/* =========================================================
   NAVIGATION
========================================================= */

function navHome(button){

  document
    .querySelectorAll(".navBtn")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  closePhone();
}

function navMap(button){

  document
    .querySelectorAll(".navBtn")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  closePhone();
  locatePlayer();
}

function logout(){

  stopMicrophone();

  if(socket){
    socket.disconnect();
    socket = null;
  }

  localStorage.removeItem("ibadan_token");

  location.reload();
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

  if(e.key === "Escape"){

    if(!$("phonePanel").classList.contains("hidden")){
      closePhone();
    }

  }

});


/* =========================================================
   AUTO LOGIN
========================================================= */

(async function(){

  const token =
    localStorage.getItem("ibadan_token");

  if(token){

    await startGame();

  }

})();
</script>
